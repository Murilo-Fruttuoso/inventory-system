{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center align-items-center min-vh-75">
    <div class="col-md-5 col-lg-4">
        <div class="text-center mb-4">
            <img src="{{ url_for('static', filename='logo_tmr.png') }}" alt="Tortoro Madureira & Ragazzi" style="height:64px;width:auto;border-radius:8px;padding:6px 12px;background:#fff;box-shadow:0 2px 8px rgba(27,63,84,0.12);">
            <div class="text-muted small mt-2" style="letter-spacing:1px;text-transform:uppercase;font-weight:600;color:#1b3f54 !important;">Controle de Estoque</div>
        </div>
        <div class="card border-0 shadow-lg">
            <div class="card-body p-4">
                <div class="text-center mb-4">
                    <h1 class="h4 fw-bold mb-1">Acesso ao sistema</h1>
                    <p class="text-muted mb-0 small">Entre com seu usuário e senha.</p>
                </div>
                <form method="post" class="vstack gap-3">
                    <div>
                        <label class="form-label">Usuário</label>
                        <input type="text" name="username" class="form-control" required autofocus>
                    </div>
                    <div>
                        <label class="form-label">Senha</label>
                        <input type="password" name="password" class="form-control" required>
                    </div>
                    <button class="btn btn-primary w-100">Entrar</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
