{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-xl-7">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1">Registrar movimentação</h1>
                <p class="text-muted mb-0">Entrada e saída com trilha de auditoria por usuário.</p>
            </div>
            <a class="btn btn-outline-secondary" href="{{ url_for('main.movements_list') }}">Voltar</a>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="post" class="row g-3">
                    <div class="col-md-8">
                        <label class="form-label">Produto</label>
                        <select class="form-select" name="product_id" id="product_id" required onchange="updateProductInfo(this)">
                            <option value="">Selecione</option>
                            {% for product in products %}
                            <option value="{{ product.id }}"
                                data-brand="{{ product.brand or '-' }}"
                                data-unit-value="{{ '%.2f'|format(product.unit_value or 0) }}"
                                data-store="{{ product.store or '' }}"
                                {% if selected_product_id == product.id %}selected{% endif %}>
                                {{ product.name }}{% if product.store %} [{{ product.store }}]{% endif %} (saldo {{ '%.2f'|format(product.quantity) }})
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Marca</label>
                        <input class="form-control" id="info_brand" readonly value="">
                    </div>

                    <div class="col-md-5">
                        <label class="form-label fw-semibold">Unidade/Filial <span class="text-danger">*</span></label>
                        <input class="form-control" name="store" id="field_store" required
                               list="store_suggestions"
                               placeholder="Ex.: Ribeirão, Brasília...">
                        <datalist id="store_suggestions">
                            {% for s in stores %}<option value="{{ s }}">{% endfor %}
                        </datalist>
                        <div class="form-text">Unidade onde a movimentação ocorreu.</div>
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Valor unitário (R$)</label>
                        <div class="input-group">
                            <span class="input-group-text">R$</span>
                            <input class="form-control" id="info_unit_value" readonly value="">
                        </div>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Direção</label>
                        <select class="form-select" name="direction" required>
                            <option value="IN">Entrada</option>
                            <option value="OUT">Saída</option>
                        </select>
                    </div>
                    <div class="col-md-2">
                        <label class="form-label">Quantidade</label>
                        <input class="form-control" type="number" name="quantity" step="any" min="0.01" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label">Tipo</label>
                        <input class="form-control" name="reason" placeholder="compra, devolução, venda, uso, perda..." required>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Observações</label>
                        <textarea class="form-control" name="note" rows="3"></textarea>
                    </div>
                    <div class="col-12 d-flex justify-content-end gap-2 mt-3">
                        <a class="btn btn-outline-secondary" href="{{ url_for('main.movements_list') }}">Cancelar</a>
                        <button class="btn btn-primary">Salvar movimentação</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
function updateProductInfo(select) {
    const opt = select.options[select.selectedIndex];
    document.getElementById('info_brand').value = opt.dataset.brand || '';
    document.getElementById('info_unit_value').value = opt.dataset.unitValue || '';
    // Pre-fill store from product, but allow user to change
    const storeField = document.getElementById('field_store');
    if (opt.dataset.store && !storeField.value) {
        storeField.value = opt.dataset.store;
    }
}
window.addEventListener('DOMContentLoaded', function() {
    const sel = document.getElementById('product_id');
    if (sel) updateProductInfo(sel);
});
</script>
{% endblock %}
