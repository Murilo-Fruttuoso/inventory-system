{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-xl-8">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h4 mb-1"><i class="bi bi-currency-dollar me-2 text-success"></i>Adicionar Cotação</h1>
                <p class="text-muted mb-0 small">Solicitação: <strong>{{ pr.title }}</strong></p>
            </div>
            <a class="btn btn-outline-secondary btn-sm" href="{{ url_for('purchasing.view_request', pr_id=pr.id) }}">Voltar</a>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="post" class="row g-3">
                    <div class="col-md-6">
                        <label class="form-label fw-semibold">Fornecedor <span class="text-danger">*</span></label>
                        <input class="form-control" name="supplier" required placeholder="Nome do fornecedor"
                               value="{{ q.supplier if q else '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Marca</label>
                        <input class="form-control" name="brand" placeholder="Marca do produto"
                               value="{{ q.brand if q else '' }}">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Data da Compra</label>
                        <input class="form-control" type="date" name="purchase_date" id="q_purchase_date"
                               value="{{ q.purchase_date.strftime('%Y-%m-%d') if q and q.purchase_date else '' }}">
                    </div>

                    <div class="col-12">
                        <label class="form-label">Link de Compra</label>
                        <input class="form-control" name="purchase_link" type="url" placeholder="https://..."
                               value="{{ q.purchase_link if q else '' }}">
                    </div>

                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Quantidade <span class="text-danger">*</span></label>
                        <input class="form-control" type="number" name="quantity" id="q_qty" step="0.001" min="0.001"
                               value="{{ q.quantity if q else '1' }}" oninput="calcTotal()">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Valor Unitário (R$) <span class="text-danger">*</span></label>
                        <input class="form-control" type="number" name="unit_price" id="q_unit" step="0.01" min="0"
                               value="{{ '%.2f'|format(q.unit_price) if q else '0.00' }}" oninput="calcTotal()">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label">Frete (R$)</label>
                        <input class="form-control" type="number" name="freight" id="q_freight" step="0.01" min="0"
                               value="{{ '%.2f'|format(q.freight or 0) if q else '0.00' }}" oninput="calcTotal()">
                    </div>
                    <div class="col-md-3">
                        <label class="form-label fw-semibold">Total (R$)</label>
                        <input class="form-control fw-bold" id="q_total" readonly
                               value="{{ '%.2f'|format(q.total_value) if q else '0.00' }}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Forma de Pagamento</label>
                        <select class="form-select" name="payment_method">
                            <option value="">Selecione...</option>
                            {% for m in ['Cartão de Crédito','Boleto','Pix','Transferência','Cheque','Outro'] %}
                            <option value="{{ m }}" {% if q and q.payment_method == m %}selected{% endif %}>{{ m }}</option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Quantidade de Parcelas</label>
                        <input class="form-control" type="number" name="installments" min="1" max="60"
                               value="{{ q.installments if q else 1 }}">
                        <div class="form-text">1 = à vista.</div>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">Prazo de Entrega</label>
                        <input class="form-control" name="delivery_deadline" placeholder="Ex: 5 dias úteis"
                               value="{{ q.delivery_deadline if q else '' }}">
                    </div>

                    <div class="col-md-4">
                        <label class="form-label">Nota Fiscal nº</label>
                        <input class="form-control" name="invoice_number"
                               value="{{ q.invoice_number if q else '' }}">
                    </div>
                    <div class="col-md-4">
                        <div class="form-check form-switch mt-4">
                            <input class="form-check-input" type="checkbox" name="invoice_attached" id="inv_attached"
                                   {% if q and q.invoice_attached %}checked{% endif %}>
                            <label class="form-check-label" for="inv_attached">NF Anexada</label>
                        </div>
                    </div>

                    <div class="col-12">
                        <label class="form-label">Observações</label>
                        <textarea class="form-control" name="notes" rows="2"
                                  placeholder="Condições especiais, validade, etc.">{{ q.notes if q else '' }}</textarea>
                    </div>

                    <div class="col-12 d-flex justify-content-end gap-2 border-top pt-3">
                        <a class="btn btn-outline-secondary" href="{{ url_for('purchasing.view_request', pr_id=pr.id) }}">Cancelar</a>
                        <button class="btn btn-success"><i class="bi bi-plus-circle me-1"></i>Salvar Cotação</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
{% block scripts %}
<script>
function calcTotal() {
    var qty = parseFloat(document.getElementById('q_qty').value) || 0;
    var unit = parseFloat(document.getElementById('q_unit').value) || 0;
    var freight = parseFloat(document.getElementById('q_freight').value) || 0;
    document.getElementById('q_total').value = (qty * unit + freight).toFixed(2);
}
// Auto-fill date
(function(){
    var d = document.getElementById('q_purchase_date');
    if (d && !d.value) d.value = new Date().toISOString().split('T')[0];
    calcTotal();
})();
</script>
{% endblock %}
