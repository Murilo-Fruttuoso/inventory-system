{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-xl-6">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <div>
                <h1 class="h3 mb-1">{{ 'Editar Orçamento' if budget else 'Definir Orçamento' }}</h1>
                <p class="text-muted mb-0">
                    <span class="badge text-bg-secondary font-monospace">{{ account.code }}</span>
                    {{ account.description }}
                </p>
            </div>
            <a class="btn btn-outline-secondary" href="{{ url_for('budget.overview', year=year) }}">Voltar</a>
        </div>
        <div class="card border-0 shadow-sm">
            <div class="card-body p-4">
                <form method="post" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label fw-semibold">Ano</label>
                        <input class="form-control" type="number" name="year"
                               min="2020" max="2099"
                               value="{{ budget.year if budget else year }}">
                    </div>
                    <div class="col-md-8">
                        <label class="form-label fw-semibold">Valor Orçado (R$) <span class="text-danger">*</span></label>
                        <div class="input-group">
                            <span class="input-group-text">R$</span>
                            <input class="form-control" type="number" step="0.01" min="0" name="budgeted_value" required
                                   value="{{ '%.2f'|format(budget.budgeted_value) if budget else '0.00' }}">
                        </div>
                    </div>
                    <div class="col-12">
                        <label class="form-label">Observações</label>
                        <textarea class="form-control" name="notes" rows="3">{{ budget.notes if budget else '' }}</textarea>
                    </div>
                    <div class="col-12 d-flex justify-content-end gap-2 mt-3">
                        <a class="btn btn-outline-secondary" href="{{ url_for('budget.overview', year=year) }}">Cancelar</a>
                        <button class="btn btn-primary"><i class="bi bi-save me-1"></i>Salvar Orçamento</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
